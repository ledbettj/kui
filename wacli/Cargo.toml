[package]
name = "wacli"
version = "0.1.0"
edition = "2024"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.2.1"
ureq = { version = "3.5.1", features = ["json", "gzip"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
flate2 = "1.1.11"
